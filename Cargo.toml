[package]
name = "ezrama"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
description = "Keeps a TRYX Panorama SE display on its stored media without the vendor application running"
license = "MIT"

[dependencies]

[[bin]]
name = "ezrama"
path = "src/main.rs"

[[bin]]
name = "ezramaw"
path = "src/bin/ezramaw.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
